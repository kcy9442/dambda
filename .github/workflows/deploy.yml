name: Deploy

on:
  workflow_run:
    workflows: [CI]
    types: [completed]
  workflow_dispatch:

permissions:
  contents: read
  id-token: write

concurrency:
  group: production-deploy
  cancel-in-progress: false

jobs:
  deploy:
    if: >-
      github.event_name == 'workflow_dispatch' ||
      (github.event.workflow_run.conclusion == 'success' && github.event.workflow_run.head_branch == 'main')
    runs-on: ubuntu-latest
    environment: production
    env:
      TAVILY_API_KEY: ${{ secrets.TAVILY_API_KEY }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.workflow_run.head_sha || github.sha }}
      - uses: hashicorp/setup-terraform@v3
      - uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ vars.AWS_DEPLOY_ROLE_ARN }}
          aws-region: ${{ vars.AWS_REGION || 'ap-northeast-2' }}
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - run: npm ci
        working-directory: backend
      - run: npm ci
        working-directory: lambda/moderation
      - name: Terraform init
        working-directory: terraform
        run: >-
          terraform init
          -backend-config="bucket=${{ vars.TF_STATE_BUCKET }}"
          -backend-config="key=${{ vars.TF_STATE_KEY }}"
          -backend-config="region=${{ vars.TF_STATE_REGION || vars.AWS_REGION }}"
          -backend-config="use_lockfile=true"
      - name: Bootstrap and update Tavily secret
        if: env.TAVILY_API_KEY != ''
        working-directory: terraform
        env:
          TF_VAR_bedrock_guardrail_profile_identifier: ${{ vars.BEDROCK_GUARDRAIL_PROFILE_ARN }}
        shell: bash
        run: |
          terraform apply -input=false -auto-approve -target=aws_secretsmanager_secret.tavily_api_key
          secret_arn="$(terraform output -raw tavily_secret_arn)"
          aws secretsmanager put-secret-value --secret-id "$secret_arn" --secret-string "$TAVILY_API_KEY" >/dev/null
      - name: Terraform plan
        working-directory: terraform
        env:
          TF_VAR_bedrock_guardrail_profile_identifier: ${{ vars.BEDROCK_GUARDRAIL_PROFILE_ARN }}
        run: terraform plan -input=false -lock-timeout=5m -out=tfplan
      - name: Terraform apply exact plan
        working-directory: terraform
        run: terraform apply -input=false -auto-approve tfplan
      - name: Read deployment outputs
        id: tf
        working-directory: terraform
        shell: bash
        run: |
          echo "ecr=$(terraform output -raw backend_ecr_repository_url)" >> "$GITHUB_OUTPUT"
          echo "cluster=$(terraform output -raw backend_ecs_cluster_name)" >> "$GITHUB_OUTPUT"
          echo "service=$(terraform output -raw backend_ecs_service_name)" >> "$GITHUB_OUTPUT"
          echo "api=$(terraform output -raw api_gateway_endpoint)" >> "$GITHUB_OUTPUT"
      - uses: aws-actions/amazon-ecr-login@v2
      - name: Build and push backend image
        env:
          ECR: ${{ steps.tf.outputs.ecr }}
          SHA: ${{ github.event.workflow_run.head_sha || github.sha }}
        run: |
          docker build -t "$ECR:$SHA" -t "$ECR:latest" backend
          docker push "$ECR:$SHA"
          docker push "$ECR:latest"
      - name: Deploy ECS and wait
        env:
          CLUSTER: ${{ steps.tf.outputs.cluster }}
          SERVICE: ${{ steps.tf.outputs.service }}
        run: |
          aws ecs update-service --cluster "$CLUSTER" --service "$SERVICE" --force-new-deployment
          aws ecs wait services-stable --cluster "$CLUSTER" --services "$SERVICE"
      - name: API smoke test
        env:
          API: ${{ steps.tf.outputs.api }}
        run: curl --fail --retry 6 --retry-delay 10 "$API/"
