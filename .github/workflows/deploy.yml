name: Deploy

on:
  workflow_run:
    workflows: [CI]
    types: [completed]
  workflow_dispatch:

permissions:
  contents: read
  id-token: write

concurrency:
  group: production-deploy
  cancel-in-progress: false

jobs:
  deploy:
    if: >-
      github.event_name == 'workflow_dispatch' ||
      (github.event.workflow_run.conclusion == 'success' && github.event.workflow_run.head_branch == 'main')
    runs-on: ubuntu-latest
    environment: production
    env:
      TAVILY_API_KEY: ${{ secrets.TAVILY_API_KEY }}
      TF_VAR_google_client_id: ${{ secrets.GOOGLE_CLIENT_ID }}
      TF_VAR_google_client_secret: ${{ secrets.GOOGLE_CLIENT_SECRET }}
      TF_VAR_enable_managed_grafana: ${{ vars.ENABLE_MANAGED_GRAFANA || 'false' }}
      TF_VAR_enable_cost_controls: ${{ vars.ENABLE_COST_CONTROLS || 'true' }}
      # The account already has its single allowed AWS_SERVICES anomaly monitor.
      TF_VAR_enable_cost_anomaly_detection: 'false'
      TF_VAR_cost_alert_email: ${{ vars.COST_ALERT_EMAIL || '' }}
      TF_VAR_monthly_budget_usd: ${{ vars.MONTHLY_BUDGET_USD || '25' }}
      TF_VAR_cost_anomaly_threshold_usd: ${{ vars.COST_ANOMALY_THRESHOLD_USD || '5' }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.workflow_run.head_sha || github.sha }}
      - uses: hashicorp/setup-terraform@v3
      - uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ vars.AWS_DEPLOY_ROLE_ARN || 'arn:aws:iam::469072180472:role/dambda-github-deploy' }}
          aws-region: ${{ vars.AWS_REGION || 'ap-northeast-2' }}
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true
      - run: npm ci
        working-directory: backend
      - run: npm ci
        working-directory: lambda/moderation
      - run: npm ci
        working-directory: lambda/dr-failover
      - name: Terraform init
        working-directory: terraform
        run: >-
          terraform init
          -backend-config="bucket=${{ vars.TF_STATE_BUCKET || 'dambda-469072180472-terraform-state' }}"
          -backend-config="key=${{ vars.TF_STATE_KEY || 'dambda/production.tfstate' }}"
          -backend-config="region=${{ vars.TF_STATE_REGION || vars.AWS_REGION || 'ap-northeast-2' }}"
          -backend-config="use_lockfile=true"
      - name: Validate deployment configuration
        shell: bash
        run: |
          test -n "$TAVILY_API_KEY" || { echo "production secret TAVILY_API_KEY is required"; exit 1; }
          test -n "$TF_VAR_google_client_id" || { echo "production secret GOOGLE_CLIENT_ID is required"; exit 1; }
          test -n "$TF_VAR_google_client_secret" || { echo "production secret GOOGLE_CLIENT_SECRET is required"; exit 1; }
          test -n "$TF_VAR_cost_alert_email" || { echo "production variable COST_ALERT_EMAIL is required"; exit 1; }
      - name: Bootstrap ECR repository and Tavily secret
        working-directory: terraform
        env:
          TF_VAR_bedrock_guardrail_profile_identifier: ${{ vars.BEDROCK_GUARDRAIL_PROFILE_ARN }}
        shell: bash
        run: |
          secret_name="my-app-dev/tavily-api-key"

          # Secrets Manager keeps a deleted secret name reserved during its recovery
          # window. Restore and import it so a destroy/redeploy cycle remains safe.
          if aws secretsmanager describe-secret --secret-id "$secret_name" >/dev/null 2>&1; then
            deleted_date="$(aws secretsmanager describe-secret --secret-id "$secret_name" --query 'DeletedDate' --output text)"
            if [[ -n "$deleted_date" && "$deleted_date" != "None" ]]; then
              echo "Restoring Tavily secret scheduled for deletion."
              aws secretsmanager restore-secret --secret-id "$secret_name"
            fi
            secret_arn="$(aws secretsmanager describe-secret --secret-id "$secret_name" --query 'ARN' --output text)"
            # Import is required before the full plan.  Do not hide an import
            # failure: a restored secret exists in AWS but is absent from a
            # newly recreated Terraform state.
            terraform state show aws_secretsmanager_secret.tavily_api_key >/dev/null 2>&1 || \
              terraform import -input=false aws_secretsmanager_secret.tavily_api_key "$secret_arn"
          fi

          # A partially failed apply can create an Amazon Managed Grafana
          # workspace before Terraform persists state. Import it by workspace
          # ID so reruns do not send a duplicate create request.
          if [[ "$TF_VAR_enable_managed_grafana" == "true" ]]; then
            if ! terraform state show 'module.monitoring.aws_grafana_workspace.main[0]' >/dev/null 2>&1; then
              grafana_workspace_id="None"
              # Workspace creation is asynchronous. The first failed Terraform
              # apply may have submitted it before state could be written.
              for attempt in {1..36}; do
                grafana_workspace_id="$(aws grafana list-workspaces --query "workspaces[?name=='my-app-dev-observability'].id | [0]" --output text)"
                if [[ -n "$grafana_workspace_id" && "$grafana_workspace_id" != "None" ]]; then
                  break
                fi
                echo "Waiting for existing Grafana workspace ($attempt/36)..."
                sleep 10
              done

              if [[ -n "$grafana_workspace_id" && "$grafana_workspace_id" != "None" ]]; then
                terraform import -input=false 'module.monitoring.aws_grafana_workspace.main[0]' "$grafana_workspace_id"
              else
                # AWS can retain a previous CreateWorkspace request without
                # exposing the workspace ID to ListWorkspaces.  Continuing
                # with Grafana enabled would make the whole application
                # deployment fail with ConflictException.  Deploy the app and
                # keep AMP/CloudWatch enabled; Grafana can be enabled again
                # after the stale request becomes visible or is cleared.
                echo "Grafana workspace is still unavailable after waiting; skipping Managed Grafana for this deployment."
                aws grafana list-workspaces --output table || true
                echo "TF_VAR_enable_managed_grafana=false" >> "$GITHUB_ENV"
              fi
            fi
          fi

          # Replication must exist before the image push because ECR does not
          # backfill images that were pushed before replication was enabled.
          terraform apply -input=false -auto-approve \
            -target=module.compute_us.aws_ecr_repository.backend \
            -target=aws_ecr_replication_configuration.backend

          # The targeted apply is only needed for a brand-new environment.
          # On an existing stack it can conflict with Terraform moved blocks.
          if aws ecr describe-repositories --repository-names my-app-dev-backend >/dev/null 2>&1 && \
             aws secretsmanager describe-secret --secret-id "$secret_name" >/dev/null 2>&1; then
            echo "Bootstrap resources already exist; skipping targeted apply."
          else
            terraform apply -input=false -auto-approve \
              -target=module.compute.aws_ecr_repository.backend \
              -target=module.compute.aws_iam_role_policy.ecs_execution_secrets \
              -target=aws_secretsmanager_secret.tavily_api_key
          fi
          # Bootstrap can run against a freshly recreated state, where Terraform
          # outputs do not exist yet. Read these values from AWS instead.
          secret_arn="$(aws secretsmanager describe-secret --secret-id "$secret_name" --query 'ARN' --output text)"
          aws secretsmanager put-secret-value --secret-id "$secret_arn" --secret-string "$TAVILY_API_KEY" >/dev/null
          echo "ecr=$(aws ecr describe-repositories --repository-names my-app-dev-backend --query 'repositories[0].repositoryUri' --output text)" >> "$GITHUB_OUTPUT"
        id: bootstrap
      - uses: aws-actions/amazon-ecr-login@v2
      - name: Build and push backend image before ECS creation
        env:
          ECR: ${{ steps.bootstrap.outputs.ecr }}
          SHA: ${{ github.event.workflow_run.head_sha || github.sha }}
        run: |
          docker build -t "$ECR:$SHA" -t "$ECR:latest" backend
          docker push "$ECR:$SHA"
          docker push "$ECR:latest"
      - name: Terraform plan
        working-directory: terraform
        env:
          TF_VAR_bedrock_guardrail_profile_identifier: ${{ vars.BEDROCK_GUARDRAIL_PROFILE_ARN }}
        run: terraform plan -input=false -lock-timeout=5m -out=tfplan
      - name: Terraform apply exact plan
        working-directory: terraform
        run: terraform apply -input=false -auto-approve tfplan
      - name: Read deployment outputs
        id: tf
        working-directory: terraform
        shell: bash
        run: |
          echo "cluster=$(terraform output -raw backend_ecs_cluster_name)" >> "$GITHUB_OUTPUT"
          echo "service=$(terraform output -raw backend_ecs_service_name)" >> "$GITHUB_OUTPUT"
          echo "api=$(terraform output -raw api_gateway_endpoint)" >> "$GITHUB_OUTPUT"
          echo "api_healthcheck=$(terraform output -raw api_gateway_healthcheck_endpoint)" >> "$GITHUB_OUTPUT"
          echo "web_bucket=$(terraform output -raw static_site_bucket_name)" >> "$GITHUB_OUTPUT"
          echo "web_distribution=$(terraform output -raw static_site_distribution_id)" >> "$GITHUB_OUTPUT"
          echo "cognito_domain=$(terraform output -raw cognito_oauth_domain)" >> "$GITHUB_OUTPUT"
          echo "cognito_client_id=$(terraform output -raw cognito_user_pool_client_id)" >> "$GITHUB_OUTPUT"
          echo "product_catalog_table=$(terraform output -raw product_catalog_table_name)" >> "$GITHUB_OUTPUT"
      - name: Deploy ECS and wait
        env:
          CLUSTER: ${{ steps.tf.outputs.cluster }}
          SERVICE: ${{ steps.tf.outputs.service }}
        run: |
          aws ecs update-service --cluster "$CLUSTER" --service "$SERVICE" --force-new-deployment
          aws ecs wait services-stable --cluster "$CLUSTER" --services "$SERVICE"
      - name: API smoke test
        env:
          API_HEALTHCHECK: ${{ steps.tf.outputs.api_healthcheck }}
        run: curl --fail --retry 6 --retry-all-errors --retry-delay 10 "${API_HEALTHCHECK%/}/"
      - name: Seed product catalog when empty
        working-directory: backend
        env:
          PRODUCT_CATALOG_TABLE_NAME: ${{ steps.tf.outputs.product_catalog_table }}
        shell: bash
        run: |
          item_count="$(aws dynamodb scan --table-name "$PRODUCT_CATALOG_TABLE_NAME" --select COUNT --query Count --output text)"
          if [[ "$item_count" == "0" ]]; then
            echo "Fresh product catalog detected; seeding product data and translations."
            npm run seed:products
          else
            echo "Product catalog already contains $item_count item(s); skipping seed."
          fi
      - name: Build Flutter web
        working-directory: dambda
        env:
          API: ${{ steps.tf.outputs.api }}
          COGNITO_DOMAIN: ${{ steps.tf.outputs.cognito_domain }}
          COGNITO_CLIENT_ID: ${{ steps.tf.outputs.cognito_client_id }}
        run: |
          flutter pub get
          flutter build web --release \
            --dart-define=API_BASE_URL="${API%/}" \
            --dart-define=COGNITO_OAUTH_DOMAIN="$COGNITO_DOMAIN" \
            --dart-define=COGNITO_CLIENT_ID="$COGNITO_CLIENT_ID"
      - name: Publish Flutter web to S3
        env:
          WEB_BUCKET: ${{ steps.tf.outputs.web_bucket }}
        run: aws s3 sync dambda/build/web/ "s3://$WEB_BUCKET/" --delete
      - name: Invalidate CloudFront cache
        env:
          WEB_DISTRIBUTION: ${{ steps.tf.outputs.web_distribution }}
        run: aws cloudfront create-invalidation --distribution-id "$WEB_DISTRIBUTION" --paths '/*'
