name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  backend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: |
            backend/package-lock.json
            lambda/moderation/package-lock.json
            lambda/dr-failover/package-lock.json
      - run: npm ci
        working-directory: backend
      - name: Check backend JavaScript
        shell: bash
        run: find src scripts -name '*.js' -print0 | xargs -0 -n1 node --check
        working-directory: backend
      - run: npm ci
        working-directory: lambda/moderation
      - run: node --check index.js
        working-directory: lambda/moderation
      - run: npm ci
        working-directory: lambda/dr-failover
      - run: node --check index.js
        working-directory: lambda/dr-failover
      - run: docker build -t dambda-backend:ci .
        working-directory: backend

  flutter:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true
      - run: flutter pub get
        working-directory: dambda
      - run: flutter analyze
        working-directory: dambda
      - run: flutter test
        working-directory: dambda
      - run: flutter build web --release
        working-directory: dambda

  terraform:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: hashicorp/setup-terraform@v3
      - run: terraform fmt -check -recursive
        working-directory: terraform
      - run: terraform init -backend=false
        working-directory: terraform
      - run: terraform validate
        working-directory: terraform
      - name: Reject committed Terraform state and plans
        shell: bash
        run: |
          tracked="$(git ls-files '*.tfstate' '*.tfstate.*' '*.tfplan')"
          test -z "$tracked" || { echo "Remove generated Terraform files:"; echo "$tracked"; exit 1; }

